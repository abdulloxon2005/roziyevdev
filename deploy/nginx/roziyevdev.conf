# ==============================================================================
# Nginx konfiguratsiyasi: roziyevdev platformasi
# Joylashuv: /etc/nginx/sites-available/roziyevdev
# Faollashtirish: sudo ln -s /etc/nginx/sites-available/roziyevdev /etc/nginx/sites-enabled/
# ==============================================================================

upstream roziyevdev_app {
    server unix:/run/gunicorn_roziyevdev.sock fail_timeout=0;
}

# 1. HTTP so'rovlarni HTTPS ga yo'naltirish
server {
    listen 80;
    listen [::]:80;
    server_name roziyev.dev www.roziyev.dev;

    # Certbot SSL tekshiruvi uchun
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Asosiy HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name roziyev.dev www.roziyev.dev;

    # SSL sertifikat fayllari (Certbot o'rnatgandan so'ng avtomatik yangilanadi)
    # ssl_certificate /etc/letsencrypt/live/roziyev.dev/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/roziyev.dev/privkey.pem;

    # SSL xavfsizlik parametrlari
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Katta hajmdagi video va fayllarni yuklash uchun maksimal hajm (500 MB)
    client_max_body_size 500M;
    client_body_timeout 300s;

    # Gzip siqish
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # STATIK FAYLLAR (CSS, JS, Rasmlar, Shriftlar)
    location /static/ {
        alias /var/www/roziyevdev/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # MEDIA FAYLLAR (Yuklangan videolar, muqovalar, vazifalar, avatarlar)
    location /media/ {
        alias /var/www/roziyevdev/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ASOSIY ILOVA (Gunicorn orqali)
    location / {
        proxy_pass http://roziyevdev_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Video yuklash va katta operatsiyalar uchun uzoqroq kutish vaqti
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }
}
