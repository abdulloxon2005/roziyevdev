{% extends 'base.html' %}

{% block title %}Ro'yxatdan O'tish — roziyevdev{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center py-16 px-4 sm:px-6 lg:px-8 relative">
    <!-- Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[450px] h-[450px] bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="max-w-lg w-full space-y-8 bg-[#111827] border border-slate-800 rounded-3xl p-8 sm:p-10 shadow-2xl relative">
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center mx-auto text-xl shadow-lg">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Hisob Yaratish</h2>
            <p class="text-xs sm:text-sm text-slate-400">
                Online kurslarni o'rganishni bugun bepul boshlang
            </p>
        </div>

        <!-- Form -->
        <form method="POST" action="{% url 'register' %}" class="space-y-4">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="first_name" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Ismingiz
                    </label>
                    <input 
                        type="text" 
                        id="first_name" 
                        name="first_name" 
                        required 
                        placeholder="Ali" 
                        class="w-full px-4 py-3 rounded-xl bg-[#0b0f19] border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 transition-colors"
                    >
                </div>
                <div>
                    <label for="last_name" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Familiyangiz
                    </label>
                    <input 
                        type="text" 
                        id="last_name" 
                        name="last_name" 
                        placeholder="Valiyev" 
                        class="w-full px-4 py-3 rounded-xl bg-[#0b0f19] border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 transition-colors"
                    >
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Username
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required 
                        placeholder="alivaliyev" 
                        class="w-full px-4 py-3 rounded-xl bg-[#0b0f19] border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 transition-colors"
                    >
                </div>
                <div>
                    <label for="phone" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Telefon raqam
                    </label>
                    <input 
                        type="text" 
                        id="phone" 
                        name="phone" 
                        placeholder="+998 90 123 45 67" 
                        class="w-full px-4 py-3 rounded-xl bg-[#0b0f19] border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 transition-colors"
                    >
                </div>
            </div>

            <div>
                <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                    Elektron pochta (Email)
                </label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="ali@misol.uz" 
                        class="w-full pl-11 pr-4 py-3 rounded-xl bg-[#0b0f19] border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 transition-colors"
                    >
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Parol (kamida 6 ta belgi)
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="••••••••" 
                        class="w-full px-4 py-3 rounded-xl bg-[#0b0f19] border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 transition-colors"
                    >
                </div>
                <div>
                    <label for="password_confirm" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Parolni tasdiqlang
                    </label>
                    <input 
                        type="password" 
                        id="password_confirm" 
                        name="password_confirm" 
                        required 
                        placeholder="••••••••" 
                        class="w-full px-4 py-3 rounded-xl bg-[#0b0f19] border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 transition-colors"
                    >
                </div>
            </div>

            <button type="submit" class="w-full mt-2 py-3.5 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-sm shadow-lg shadow-blue-600/30 hover:shadow-blue-600/50 transition-all duration-200 flex items-center justify-center gap-2">
                <span>Ro'yxatdan O'tish</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Login Link -->
        <div class="text-center text-xs text-slate-400">
            Hisobingiz bormi? 
            <a href="{% url 'login' %}" class="text-blue-400 hover:text-blue-300 font-semibold ml-1">
                Tizimga kirish
            </a>
        </div>
    </div>
</div>
{% endblock %}
