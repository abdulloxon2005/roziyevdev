{% extends 'base.html' %}

{% block title %}Ro'yxatdan O'tish — roziyevdev{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center py-16 px-4 sm:px-6 lg:px-8 relative">
    <!-- Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[450px] h-[450px] bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="max-w-lg w-full space-y-8 bg-white dark:bg-[#111827] border border-slate-200 dark:border-slate-800 rounded-3xl p-8 sm:p-10 shadow-xl dark:shadow-2xl relative transition-colors">
        <!-- Logo Header -->
        <div class="text-center space-y-3">
            <a href="{% url 'home' %}" class="inline-flex items-center gap-3 group">
                <img src="/static/images/logo_emblem.png" alt="RoziyevDev" class="h-12 w-auto object-contain filter drop-shadow-md group-hover:scale-105 transition-transform duration-200">
                <div class="text-left">
                    <div class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white leading-none">roziyev<span class="text-blue-600 dark:text-blue-400">.dev</span></div>
                    <div class="text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400 font-semibold mt-1">Online Akademiya</div>
                </div>
            </a>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Hisob Yaratish</h2>
            <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-400">
                Online kurslarni o'rganishni bugun bepul boshlang
            </p>
        </div>

        <!-- Form -->
        <form method="POST" action="{% url 'register' %}" class="space-y-4">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="first_name" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
                        Ismingiz
                    </label>
                    <input 
                        type="text" 
                        id="first_name" 
                        name="first_name" 
                        required 
                        placeholder="Ali" 
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-[#0b0f19] border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 text-sm focus:outline-none focus:border-blue-500 transition-colors shadow-sm"
                    >
                </div>
                <div>
                    <label for="last_name" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
                        Familiyangiz
                    </label>
                    <input 
                        type="text" 
                        id="last_name" 
                        name="last_name" 
                        placeholder="Valiyev" 
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-[#0b0f19] border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 text-sm focus:outline-none focus:border-blue-500 transition-colors shadow-sm"
                    >
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
                        Username
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required 
                        placeholder="alivaliyev" 
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-[#0b0f19] border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 text-sm focus:outline-none focus:border-blue-500 transition-colors shadow-sm"
                    >
                </div>
                <div>
                    <label for="phone" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
                        Telefon raqam
                    </label>
                    <input 
                        type="text" 
                        id="phone" 
                        name="phone" 
                        placeholder="+998 90 123 45 67" 
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-[#0b0f19] border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 text-sm focus:outline-none focus:border-blue-500 transition-colors shadow-sm"
                    >
                </div>
            </div>

            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
                    Elektron pochta (Email)
                </label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="ali@misol.uz" 
                        class="w-full pl-11 pr-4 py-3 rounded-xl bg-slate-50 dark:bg-[#0b0f19] border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 text-sm focus:outline-none focus:border-blue-500 transition-colors shadow-sm"
                    >
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
                        Parol (kamida 6 ta belgi)
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="••••••••" 
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-[#0b0f19] border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 text-sm focus:outline-none focus:border-blue-500 transition-colors shadow-sm"
                    >
                </div>
                <div>
                    <label for="password_confirm" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
                        Parolni tasdiqlang
                    </label>
                    <input 
                        type="password" 
                        id="password_confirm" 
                        name="password_confirm" 
                        required 
                        placeholder="••••••••" 
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-[#0b0f19] border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 text-sm focus:outline-none focus:border-blue-500 transition-colors shadow-sm"
                    >
                </div>
            </div>

            <button type="submit" class="w-full mt-2 py-3.5 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-sm shadow-lg shadow-blue-600/30 hover:shadow-blue-600/50 transition-all duration-200 flex items-center justify-center gap-2">
                <span>Ro'yxatdan O'tish</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Login Link -->
        <div class="text-center text-xs text-slate-500 dark:text-slate-400">
            Hisobingiz bormi? 
            <a href="{% url 'login' %}" class="text-blue-600 dark:text-blue-400 hover:underline font-semibold ml-1">
                Tizimga kirish
            </a>
        </div>
    </div>
</div>
{% endblock %}
